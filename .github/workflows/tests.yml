name: Isolated controller tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest pytest-asyncio
      - run: python -m compileall -q custom_components/radiator_orchestrator
      - run: python -m json.tool custom_components/radiator_orchestrator/strings.json > /dev/null
      - run: python -m json.tool custom_components/radiator_orchestrator/translations/en.json > /dev/null
      - run: python -m pytest -q
